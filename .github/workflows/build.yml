
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -q MLBB_Floating_Menu_Source.zip -d project
          ls -la project
          test -f project/app/build.gradle

      - name: Fix Java target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle")
          s = p.read_text()

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              if "android {" not in s:
                  raise SystemExit("Blok android tidak ditemukan")

              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  1
              )

          p.write_text(s)
          print("Java target berhasil diatur ke 17")
          PY

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Floating-Menu-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk

